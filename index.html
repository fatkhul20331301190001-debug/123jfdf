<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Infaq & Sedekah - MI Ma'arif Kuwaderan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nuGreen: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            600: '#16a34a', 700: '#15803d', 800: '#166534',
                            900: '#0d4e28', 950: '#052e16',
                        },
                        nuGold: {
                            300: '#fde047', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

    <header class="bg-gradient-to-r from-nuGreen-950 via-nuGreen-900 to-nuGreen-950 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3.5">
                    <div class="w-14 h-14 rounded-xl bg-white p-1 shadow-inner flex items-center justify-center overflow-hidden border-2 border-nuGold-400">
                        <img id="appLogo" src="https://placehold.co/100x100/166534/ffffff?text=MI+KWD" alt="Logo" class="w-full h-full object-contain">
                    </div>
                    <div class="text-center md:text-left">
                        <div class="inline-flex items-center gap-1.5 bg-nuGreen-800/80 px-2.5 py-0.5 rounded-full text-[11px] text-nuGold-400 border border-nuGold-500/30 font-medium mb-1">
                            <i class="fa-solid fa-mosque"></i> Portal Transparansi Publik
                        </div>
                        <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-white uppercase leading-tight">INFAQ MI MA'ARIF KUWADERAN</h1>
                        <p class="text-xs text-emerald-200/90 font-light">Sistem Pengelolaan Pemasukan & Pengeluaran Kas Madrasah</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-nuGreen-900/80 p-1.5 rounded-xl border border-emerald-700/50 shadow-inner">
                    <button type="button" onclick="setAccessMode('public')" id="btnModePublic" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-emerald-950 shadow">
                        <i class="fa-solid fa-eye"></i> Mode Publik
                    </button>
                    <button type="button" onclick="setAccessMode('admin')" id="btnModeAdmin" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-emerald-200 hover:text-white">
                        <i class="fa-solid fa-user-shield"></i> Mode Pengurus
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Total Pemasukan</p>
                <h3 class="text-2xl sm:text-3xl font-extrabold text-emerald-700" id="cardTotalMasuk">Rp 0</h3>
            </div>

            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Total Pengeluaran</p>
                <h3 class="text-2xl sm:text-3xl font-extrabold text-rose-600" id="cardTotalKeluar">Rp 0</h3>
            </div>

            <div class="bg-gradient-to-br from-nuGreen-800 via-nuGreen-900 to-nuGreen-950 rounded-2xl p-5 shadow-md text-white">
                <p class="text-xs font-bold uppercase tracking-wider text-nuGold-400 mb-2">Sisa Saldo Kas</p>
                <h3 class="text-2xl sm:text-3xl font-extrabold text-white" id="cardSisaSaldo">Rp 0</h3>
            </div>
        </div>

        <div id="adminFormSection" class="hidden bg-white rounded-2xl shadow-sm border border-emerald-200/80 p-5">
            <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus text-emerald-600"></i> Input Transaksi Kas Infaq
            </h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Kelompok Kas</label>
                    <select id="inputGroup" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs">
                        <option value="mingguan">Amal Mingguan</option>
                        <option value="bulanan">Infaq Bulanan</option>
                        <option value="lainnya">Pendapatan Lainnya</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tanggal</label>
                    <input type="date" id="inputDate" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Jenis Transaksi</label>
                    <select id="inputType" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs">
                        <option value="masuk">Pemasukan</option>
                        <option value="keluar">Pengeluaran</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Kategori</label>
                    <input type="text" id="inputCategory" placeholder="Cth: Amal Jumat" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nominal (Rp)</label>
                    <input type="number" id="inputAmount" placeholder="0" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Keterangan</label>
                    <input type="text" id="inputNote" placeholder="Uraian..." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs">
                </div>
                <div class="sm:col-span-2 lg:col-span-6 flex justify-end gap-2 mt-2">
                    <button type="button" onclick="saveTransactionDirectly()" class="bg-nuGreen-800 hover:bg-nuGreen-900 text-white font-bold px-6 py-2 rounded-xl text-xs">
                        Simpan Transaksi
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-nuGreen-950 text-white font-semibold">
                            <th class="p-3.5 text-center w-12">No</th>
                            <th class="p-3.5">Kelompok</th>
                            <th class="p-3.5">Tanggal</th>
                            <th class="p-3.5">Kategori</th>
                            <th class="p-3.5">Keterangan</th>
                            <th class="p-3.5 text-right">Pemasukan (Rp)</th>
                            <th class="p-3.5 text-right">Pengeluaran (Rp)</th>
                            <th class="p-3.5 text-center w-16">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- KODE JAVASCRIPT DIBUNGKUS DENGAN LENGKAP DI SINI -->
    <script>
        const STORAGE_KEY = 'infaq_kas_data';

        let state = {
            accessMode: 'public',
            activeTab: 'all',
            transactions: []
        };

        function loadStoredData() {
            try {
                const savedTx = localStorage.getItem(STORAGE_KEY);
                if (savedTx) {
                    state.transactions = JSON.parse(savedTx);
                }
            } catch (e) {
                console.warn("Gagal membaca memori lokal:", e);
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.transactions));
            } catch (e) {
                alert("Gagal menyimpan data ke browser.");
            }
        }

        function saveTransactionDirectly() {
            const categoryInput = document.getElementById('inputCategory');
            const amountInput = document.getElementById('inputAmount');
            const groupInput = document.getElementById('inputGroup');
            const dateInput = document.getElementById('inputDate');
            const typeInput = document.getElementById('inputType');
            const noteInput = document.getElementById('inputNote');

            if (!categoryInput.value.trim() || !amountInput.value) {
                alert('Mohon isi Kategori dan Nominal Transaksi dengan benar.');
                return;
            }

            const numericAmount = Number(amountInput.value) || 0;

            const newTx = {
                id: Date.now(),
                group: groupInput.value,
                date: dateInput.value,
                type: typeInput.value,
                category: categoryInput.value.trim(),
                amount: numericAmount,
                note: noteInput.value.trim()
            };

            state.transactions.unshift(newTx);
            saveToLocalStorage();
            renderData();
            resetFormFields();

            alert('Transaksi berhasil disimpan di browser!');
        }

        function resetFormFields() {
            document.getElementById('inputCategory').value = '';
            document.getElementById('inputAmount').value = '';
            document.getElementById('inputNote').value = '';
            const dateInput = document.getElementById('inputDate');
            if (dateInput) dateInput.valueAsDate = new Date();
        }

        function deleteTransaction(id) {
            if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveToLocalStorage();
                renderData();
            }
        }

        function formatRp(num) {
            return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const parts = String(dateStr).slice(0, 10).split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function renderData() {
            const tableBody = document.getElementById('transactionTableBody');
            
            if (tableBody) {
                tableBody.innerHTML = '';
                if (state.transactions.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-400 italic">Belum ada data transaksi tersimpan.</td></tr>`;
                } else {
                    state.transactions.forEach((tx, idx) => {
                        const row = document.createElement('tr');
                        row.className = 'hover:bg-slate-50/80 transition';
                        row.innerHTML = `
                            <td class="p-3.5 text-center font-medium text-slate-500">${idx + 1}</td>
                            <td class="p-3.5 font-bold uppercase text-[11px] text-emerald-800">${tx.group}</td>
                            <td class="p-3.5 whitespace-nowrap">${formatDate(tx.date)}</td>
                            <td class="p-3.5 font-semibold text-slate-800">${tx.category}</td>
                            <td class="p-3.5 text-slate-600">${tx.note || '-'}</td>
                            <td class="p-3.5 text-right font-bold text-emerald-600">${tx.type === 'masuk' ? formatRp(tx.amount) : '-'}</td>
                            <td class="p-3.5 text-right font-bold text-rose-600">${tx.type === 'keluar' ? formatRp(tx.amount) : '-'}</td>
                            <td class="p-3.5 text-center">
                                ${state.accessMode === 'admin' ? `
                                    <button onclick="deleteTransaction(${tx.id})" class="text-rose-500 hover:text-rose-700 font-bold px-2 py-1">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                ` : '-'}
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                }
            }

            const totalMasuk = state.transactions.filter(t => t.type === 'masuk').reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
            const totalKeluar = state.transactions.filter(t => t.type === 'keluar').reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
            const sisaSaldo = totalMasuk - totalKeluar;

            if (document.getElementById('cardTotalMasuk')) document.getElementById('cardTotalMasuk').textContent = formatRp(totalMasuk);
            if (document.getElementById('cardTotalKeluar')) document.getElementById('cardTotalKeluar').textContent = formatRp(totalKeluar);
            if (document.getElementById('cardSisaSaldo')) document.getElementById('cardSisaSaldo').textContent = formatRp(sisaSaldo);
        }

        function setAccessMode(mode) {
            state.accessMode = mode;
            const adminForm = document.getElementById('adminFormSection');
            const btnPublic = document.getElementById('btnModePublic');
            const btnAdmin = document.getElementById('btnModeAdmin');

            if (mode === 'admin') {
                if (adminForm) adminForm.classList.remove('hidden');
                if (btnAdmin) btnAdmin.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-nuGold-400 text-slate-900 shadow';
                if (btnPublic) btnPublic.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-emerald-200 hover:text-white';
            } else {
                if (adminForm) adminForm.classList.add('hidden');
                if (btnPublic) btnPublic.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-emerald-950 shadow';
                if (btnAdmin) btnAdmin.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-emerald-200 hover:text-white';
            }

            renderData();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStoredData();
            const dateInput = document.getElementById('inputDate');
            if (dateInput) dateInput.valueAsDate = new Date();
            setAccessMode('public');
            renderData();
        });
    </script>
</body>
</html>
